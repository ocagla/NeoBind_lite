[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qpmhc"
version = "0.1.0"
description = "Q-pMHC: a didactic rigid-body Metropolis sampler for a peptide-MHC complex comparing toy classical and gas-phase HF Mulliken peptide charges"
readme = "README.md"
requires-python = ">=3.10,<3.11"
license = { file = "LICENSE" }
authors = [{ name = "Q-pMHC contributors" }]
dependencies = [
  "biopython",
  "numpy",
  "pyscf",
  "scipy",
]

[project.scripts]
qpmhc = "qpmhc.core:main"

[project.optional-dependencies]
plots = ["matplotlib"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
